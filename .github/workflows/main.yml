name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح تشغيل الـ Deploy يدوياً من جيت هب

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Sanitize FTP Server Hostname
        id: sanitize
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*$||' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Verify Build Output Files
        run: |
          echo "Contents of dist/apps/web/client/:"
          ls -la dist/apps/web/client/

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.sanitize.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/

          local-dir: dist/apps/web/client/
          dangerous-clean-slate: true
          security: loose
